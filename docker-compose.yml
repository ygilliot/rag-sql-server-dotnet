# Local SQL Server 2025 for the sample and the integration tests.
# Developer edition, for development only. Change the password before anything else.
services:
  sql:
    image: mcr.microsoft.com/mssql/server:2025-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Rag_Sample_2025!"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
